<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <div class="mainContainer">
    <div class="container">
      <div class="calculator">
        <div class="calculatorHead">
          <h1 class="calculatorPara">My Calculator</h1>
          <input class="inputNumber" type="number" placeholder="0">
        </div>  
        <div class="calculatorBody">
          <button class="calculatorButtons">/</button>
          <button class="calculatorButtons">*</button>
          <button class="calculatorButtons">-</button>
          <button class="calculatorButtons">+</button>
          <button class="calculatorButtons">7</button>
          <button class="calculatorButtons">8</button>
          <button class="calculatorButtons">9</button>
          <button class="calculatorButtons">4</button>
          <button class="calculatorButtons">5</button>
          <button class="calculatorButtons">6</button>
          <button class="calculatorButtons">1</button>
          <button class="calculatorButtons">2</button>
          <button class="calculatorButtons">3</button>
          <button class="calculatorButtons">0</button>
          <button class="calculatorButtons">=</button>
        </div>
        <div class="description">

        </div>
      </div>
    </div>
  </div>
</body>
</html>
